<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 Meus Vídeos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800 min-h-screen">
    <header class="bg-white shadow-sm sticky top-0">
      <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">🎬 Meus Vídeos</h1>
        <a
          href="add.html"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl transition"
          >+ Novo Vídeo</a
        >
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
      <div class="flex gap-3 mb-6">
        <input
          id="search"
          type="text"
          placeholder="Buscar vídeo..."
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <button
          onclick="loadVideos()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition"
        >
          Buscar
        </button>
      </div>

      <div
        id="videos"
        class="grid sm:grid-cols-2 md:grid-cols-3 gap-6"
      ></div>
    </main>

    <script>
      const API_URL = "http://localhost:3333/videos";

      async function loadVideos() {
        const search = document.getElementById("search").value;
        const res = await fetch(`${API_URL}?search=${encodeURIComponent(search)}`);
        const videos = await res.json();

        const container = document.getElementById("videos");
        container.innerHTML = "";

        if (!videos.length) {
          container.innerHTML =
            '<p class="col-span-full text-center text-gray-500">Nenhum vídeo encontrado.</p>';
          return;
        }

        videos.forEach((v) => {
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-2xl shadow hover:shadow-lg p-5 transition flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <h3 class="text-xl font-semibold text-gray-800 mb-2">${v.title}</h3>
              <p class="text-gray-600 mb-3 line-clamp-3">${v.description}</p>
              <p class="text-sm text-gray-400">⏱️ ${v.duration}s</p>
            </div>
            <div class="mt-4 flex gap-2">
              <a href="edit.html?id=${v.id}" class="flex-1 text-center bg-yellow-400 hover:bg-yellow-500 text-white py-2 rounded-lg transition">Editar</a>
              <button onclick="deleteVideo('${v.id}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg transition">Excluir</button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      async function deleteVideo(id) {
        if (!confirm("Tem certeza que deseja excluir este vídeo?")) return;
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        loadVideos();
      }

      window.onload = loadVideos;
    </script>
  </body>
</html>
